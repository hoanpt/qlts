version: '3.8'

services:
  qlts-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlts-cdc-danang
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=qlts-cdc-danang-secret-key-2026
      - DATABASE_URL=file:./dev.db
    volumes:
      - qlts_data:/app/server/prisma
      - qlts_uploads:/app/server/uploads

volumes:
  qlts_data:
  qlts_uploads:
